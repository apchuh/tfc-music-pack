name: Build Resource Pack

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package resource pack
        run: |
          if [ -f pack.png ]; then
            zip -r TFC-Music-Pack-${GITHUB_REF_NAME}.zip pack.mcmeta pack.png assets/
          else
            zip -r TFC-Music-Pack-${GITHUB_REF_NAME}.zip pack.mcmeta assets/
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: TFC-Music-Pack-${GITHUB_REF_NAME}.zip
